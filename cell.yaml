# Budgets cell: one of the ten finance services split from the retired finance_* tables (2026-10-12).
# Planned spending per category and period.
# Amounts are exact (money = numeric(19,4), decimal = numeric(30,10); SPEC-003); cross-cell ids (account_id, ...) are plain bigints, not foreign keys.
cell: budgets
title: Budgets
resources:
  budget-plan:
    legacy_columns:
      scope: owner_scope
    filters:
    - scope
    - category
    - status
    ranges:
    - [period_start, period_end]
    fields:
      name:
        type: text
        required: true
        max_length: 200
      scope:
        type: text
        max_length: 64
        default: ''
      category:
        type: text
      period_start:
        type: date
        required: true
      period_end:
        type: date
        required: true
      planned_amount:
        type: money
        min: 0
        required: true
      currency:
        type: currency
        default: THB
      status:
        type: enum
        values:
        - draft
        - active
        - closed
        - cancelled
        default: draft
      notes:
        type: text
