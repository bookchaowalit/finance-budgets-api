# Budgets cell: one of the ten finance services split from the retired finance_* tables (2026-10-12).
# Planned spending per category and period.
# Amounts are real (float) like every kit cell; cross-cell ids (account_id, ...) are plain bigints, not foreign keys.
cell: budgets
title: Budgets
resources:
  budget-plan:
    filters:
    - owner_scope
    - category
    - status
    ranges:
    - [period_start, period_end]
    fields:
      name:
        type: text
        required: true
        max_length: 200
      owner_scope:
        type: enum
        values:
        - personal
        - solo_empire
        - venture
        - client
        - shared
        default: solo_empire
      category:
        type: text
      period_start:
        type: date
        required: true
      period_end:
        type: date
        required: true
      planned_amount:
        type: real
        min: 0
        required: true
      currency:
        type: text
        default: THB
        max_length: 12
      status:
        type: enum
        values:
        - draft
        - active
        - closed
        - cancelled
        default: draft
      notes:
        type: text
